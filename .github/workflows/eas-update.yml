name: EAS Update on main branch merge

on:
  push:
    branches:
      - main

jobs:
  eas-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Login to Expo using token
        run: npx expo login --token ${{ secrets.EXPO_TOKEN }}

      - name: Publish EAS update
        run: npx eas update --branch main --message "Auto update from GitHub merge"
